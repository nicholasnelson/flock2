<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1160" width="1500" height="1160" font-family="Helvetica, Arial, sans-serif">
  <title>FLOCK 2.0 M1: one sheep's brain (world model, heads, actor-critic)</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #555; stroke-width: 1.2; }
      .grp { fill: #f4f6f8; stroke: #8a96a3; stroke-width: 1.2; }
      .inp { fill: #eef6ee; stroke: #5b8a5b; stroke-width: 1.2; }
      .head { fill: #eef3fb; stroke: #4a6fa5; stroke-width: 1.2; }
      .agent { fill: #f6effa; stroke: #7a4a9a; stroke-width: 1.2; }
      .plan { fill: #fff4ec; stroke: #c2410c; stroke-width: 1.6; stroke-dasharray: 7 4; }
      .t { font-size: 13px; font-weight: bold; fill: #1f2933; }
      .s { font-size: 11.5px; fill: #333; }
      .m { font-size: 11px; fill: #333; font-family: Menlo, Consolas, monospace; }
      .n { font-size: 11px; fill: #666; font-style: italic; }
      .pl { fill: #c2410c; }
      .line { stroke: #444; stroke-width: 1.3; fill: none; }
      .rec { stroke: #888; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .pline { stroke: #c2410c; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect x="0" y="0" width="1500" height="1160" fill="#ffffff"/>

  <!-- title -->
  <text x="20" y="28" font-size="19" font-weight="bold" fill="#1f2933">One sheep's brain in Milestone 1 (all sheep share the weights; each keeps its own state h, z)</text>
  <text x="20" y="48" class="s">World model 8.71 M parameters + curiosity ensemble 1.2 M (flock/wm.py) + actor-critic 0.60 M (flock/ac.py). Shapes are height × width or vector length. Orange = curiosity (added 2026-10-24). Diagram as of the review fixes.</text>

  <!-- ===== A: inputs ===== -->
  <text x="20" y="80" class="t">Inputs at step t</text>
  <rect x="20" y="90" width="200" height="88" class="inp" rx="6"/>
  <text x="30" y="110" class="t">First-person strip</text>
  <text x="30" y="128" class="s">64 × 256 pixels, ~300° view</text>
  <text x="30" y="144" class="s">16 palette colours</text>
  <text x="30" y="160" class="s">→ one-hot: 64 × 256 × 16</text>

  <rect x="20" y="380" width="200" height="88" class="inp" rx="6"/>
  <text x="30" y="400" class="t">Felt (6 numbers)</text>
  <text x="30" y="418" class="s">energy, hydration, warmth,</text>
  <text x="30" y="434" class="s">social, interest in [0, 1.15];</text>
  <text x="30" y="450" class="s">taste (−1 after a bad mouthful)</text>

  <!-- ===== B: encoder ===== -->
  <rect x="250" y="70" width="310" height="268" class="grp" rx="8"/>
  <text x="262" y="92" class="t">Encoder  (2.30 M)</text>
  <text x="262" y="110" class="n">each stage: Conv 4×4, stride 2 → LayerNorm → SiLU</text>
  <rect x="262" y="120" width="286" height="26" class="box" rx="4"/>
  <text x="272" y="138" class="m">conv 16→32 ch        → 32 × 128</text>
  <rect x="262" y="152" width="286" height="26" class="box" rx="4"/>
  <text x="272" y="170" class="m">conv 32→64 ch        → 16 × 64</text>
  <rect x="262" y="184" width="286" height="26" class="box" rx="4"/>
  <text x="272" y="202" class="m">conv 64→96 ch        →  8 × 32</text>
  <rect x="262" y="216" width="286" height="26" class="box" rx="4"/>
  <text x="272" y="234" class="m">conv 96→128 ch       →  4 × 16</text>
  <rect x="262" y="248" width="286" height="26" class="box" rx="4"/>
  <text x="272" y="266" class="m">conv 128→192 ch      →  2 × 8</text>
  <rect x="262" y="280" width="286" height="44" class="box" rx="4"/>
  <text x="272" y="298" class="m">flatten 2×8×192 = 3,072</text>
  <text x="272" y="316" class="m">Linear 3,072 → 512  = embed</text>
  <path d="M220,134 L250,134" class="line" marker-end="url(#arr)"/>

  <rect x="250" y="390" width="310" height="66" class="box" rx="6"/>
  <text x="262" y="410" class="t">Interoception in  (3 K)</text>
  <text x="262" y="428" class="m">Linear 6 → 512</text>
  <text x="262" y="445" class="n">so the state carries how the sheep feels</text>
  <path d="M220,424 L250,424" class="line" marker-end="url(#arr)"/>

  <!-- sum junction -->
  <circle cx="590" cy="490" r="12" fill="#fff" stroke="#444" stroke-width="1.3"/>
  <text x="584" y="495" font-size="16" fill="#333">+</text>
  <path d="M405,338 L405,360 L590,360 L590,478" class="line" marker-end="url(#arr)"/>
  <path d="M560,424 L575,424 L575,482 L578,486" class="line"/>
  <text x="478" y="512" class="m">embed(t) 512</text>

  <!-- ===== C: RSSM ===== -->
  <rect x="610" y="70" width="320" height="630" class="grp" rx="8"/>
  <text x="622" y="92" class="t">RSSM core  (2.12 M)</text>
  <text x="622" y="110" class="n">MLP = Linear → LayerNorm → SiLU → Linear (hidden 384)</text>

  <rect x="622" y="122" width="296" height="62" class="box" rx="5"/>
  <text x="632" y="141" class="t">img_in MLP  (0.35 M)</text>
  <text x="632" y="159" class="m">[z(t−1) 512 ⊕ a(t−1) 9] → 384</text>
  <text x="632" y="175" class="n">a(t−1): the action just taken, one-hot of 9</text>

  <rect x="622" y="200" width="296" height="78" class="box" rx="5"/>
  <text x="632" y="219" class="t">GRU, layer-normalised  (0.89 M)</text>
  <text x="632" y="237" class="m">[x 384 ⊕ h(t−1) 384] → 3×384 gates</text>
  <text x="632" y="253" class="s">update gate biased toward keeping h</text>
  <text x="632" y="270" class="m">→ h(t): deterministic state, 384</text>
  <path d="M770,184 L770,200" class="line" marker-end="url(#arr)"/>

  <rect x="622" y="296" width="296" height="62" class="box" rx="5"/>
  <text x="632" y="315" class="t">Prior MLP  (0.35 M)</text>
  <text x="632" y="333" class="m">h 384 → 384 → 32 × 16 logits</text>
  <text x="632" y="350" class="n">guess of z without seeing: used to imagine</text>
  <path d="M700,278 L700,296" class="line" marker-end="url(#arr)"/>

  <rect x="622" y="440" width="296" height="70" class="box" rx="5"/>
  <text x="632" y="459" class="t">Posterior MLP  (0.54 M)</text>
  <text x="632" y="477" class="m">[h 384 ⊕ embed 512] → 384</text>
  <text x="632" y="493" class="m">  → 32 × 16 logits</text>
  <path d="M850,278 L850,440" class="line" marker-end="url(#arr)"/>
  <path d="M602,490 L622,490" class="line" marker-end="url(#arr)"/>

  <rect x="622" y="528" width="296" height="70" class="box" rx="5"/>
  <text x="632" y="547" class="t">Sample z(t)</text>
  <text x="632" y="565" class="s">32 categoricals × 16 classes, 1 % uniform</text>
  <text x="632" y="581" class="s">mix, straight-through → one-hot 512</text>
  <path d="M770,510 L770,528" class="line" marker-end="url(#arr)"/>
  <text x="790" y="388" class="n">KL(post ‖ prior)</text>
  <text x="790" y="402" class="n">= surprise</text>
  <path d="M770,358 L770,440" class="rec"/>

  <rect x="622" y="616" width="296" height="70" class="box" rx="5" style="fill:#fffbe6;stroke:#a68a00"/>
  <text x="632" y="636" class="t">Model state  feat(t) = [h(t), z(t)]</text>
  <text x="632" y="654" class="m">384 + 512 = 896</text>
  <text x="632" y="672" class="n">every head and the agent read only this</text>
  <path d="M770,598 L770,616" class="line" marker-end="url(#arr)"/>

  <!-- recurrence -->
  <path d="M622,664 L615,664 L615,150 L622,150" class="rec" marker-end="url(#arr)"/>
  <text x="470" y="650" class="n">next step: h(t), z(t)</text>
  <text x="470" y="664" class="n">become h(t−1), z(t−1)</text>
  <path d="M590,660 L612,664" class="rec"/>

  <!-- bus to heads -->
  <path d="M918,651 L950,651" class="line"/>
  <path d="M950,190 L950,708" class="line"/>

  <!-- ===== D: heads ===== -->
  <text x="980" y="80" class="t">Heads on feat(t)</text>

  <rect x="980" y="90" width="500" height="200" class="head" rx="8"/>
  <text x="992" y="110" class="t">Decoder: the expected strip  (3.49 M)</text>
  <text x="992" y="128" class="m">Linear 896 → 3,072 → reshape 2 × 8 × 192</text>
  <text x="992" y="146" class="m">ConvT 4×4 s2 192→128 · LN · SiLU   →  4 × 16</text>
  <text x="992" y="162" class="m">ConvT        128→96  · LN · SiLU   →  8 × 32</text>
  <text x="992" y="178" class="m">ConvT         96→64  · LN · SiLU   → 16 × 64</text>
  <text x="992" y="194" class="m">ConvT         64→32  · LN · SiLU   → 32 × 128</text>
  <text x="992" y="210" class="m">ConvT         32→16 logits         → 64 × 256 × 16</text>
  <text x="992" y="232" class="s">Trains the model to see (cross-entropy summed over the pixels).</text>
  <text x="992" y="250" class="s">Decoded from imagined states it is the sheep's "expected view"</text>
  <text x="992" y="268" class="s">shown to viewers beside the real one.</text>
  <path d="M950,190 L980,190" class="line" marker-end="url(#arr)"/>

  <rect x="980" y="306" width="500" height="62" class="head" rx="8"/>
  <text x="992" y="326" class="t">Interoception head  (0.35 M)</text>
  <text x="992" y="344" class="m">MLP 896 → 384 → 6 felt numbers</text>
  <text x="992" y="360" class="s">predicts how the sheep will feel; weight 1,000 on squared error</text>
  <path d="M950,337 L980,337" class="line" marker-end="url(#arr)"/>

  <rect x="980" y="384" width="500" height="80" class="head" rx="8"/>
  <text x="992" y="404" class="t">Reward head  (0.44 M)</text>
  <text x="992" y="422" class="m">MLP 896 → 384 → 255 bins (symlog space, −20…20)</text>
  <text x="992" y="438" class="s">two-hot cross-entropy, zero-init output; r = −drive − 0.05·bad taste</text>
  <text x="992" y="454" class="s">of the step that led here: the reward the actor imagines</text>
  <path d="M950,424 L980,424" class="line" marker-end="url(#arr)"/>

  <rect x="980" y="480" width="500" height="132" class="plan" rx="8" style="stroke-dasharray:none"/>
  <text x="992" y="500" class="t pl">Curiosity ensemble × 5  (1.2 M)</text>
  <text x="992" y="518" class="m">each head: 896 → 256 · LN · SiLU → 9 branches × 4</text>
  <text x="992" y="534" class="m">(one per action): Δ energy, water, warmth, interest ×100</text>
  <text x="992" y="552" class="s">Same data, different random starts: they agree where experience is</text>
  <text x="992" y="568" class="s">plentiful, disagree where it is missing; an untried action keeps its</text>
  <text x="992" y="584" class="s">random branch. Curiosity = 0.02 × variance across the 5 / its mean at</text>
  <text x="992" y="600" class="s">the end of infancy (then frozen, so it fades). After Plan2Explore.</text>
  <path d="M950,546 L980,546" class="line" marker-end="url(#arr)"/>

  <rect x="980" y="628" width="500" height="196" class="agent" rx="8"/>
  <text x="992" y="648" class="t">Actor-critic  (separate module, 0.60 M)</text>
  <text x="992" y="666" class="n">each: Linear → LN → SiLU, twice (256 wide), zero-initialised output</text>
  <rect x="992" y="676" width="230" height="64" class="box" rx="5"/>
  <text x="1002" y="694" class="t">Actor  (0.30 M)</text>
  <text x="1002" y="712" class="m">896 → 256 → 256 → 9</text>
  <text x="1002" y="730" class="s">action probabilities, 1 % mix</text>
  <rect x="1236" y="676" width="232" height="64" class="box" rx="5"/>
  <text x="1246" y="694" class="t">Critic  (0.30 M)</text>
  <text x="1246" y="712" class="m">896 → 256 → 256 → 1</text>
  <text x="1246" y="730" class="s">value of the state</text>
  <rect x="1236" y="750" width="232" height="60" class="box" rx="5"/>
  <text x="1246" y="768" class="t">Slow critic</text>
  <text x="1246" y="786" class="s">EMA 0.98 of the critic;</text>
  <text x="1246" y="802" class="s">bootstrap targets, regulariser</text>
  <text x="992" y="760" class="s">The chosen action goes to the</text>
  <text x="992" y="776" class="s">meadow simulator and, as a(t),</text>
  <text x="992" y="792" class="s">back into img_in at the next step.</text>
  <path d="M950,708 L992,708" class="line" marker-end="url(#arr)"/>

  <!-- ===== bottom: training ===== -->
  <rect x="20" y="850" width="700" height="290" class="grp" rx="8"/>
  <text x="32" y="874" class="t">Training the world model (no reward involved: it learns by predicting its own senses)</text>
  <text x="32" y="896" class="s">On real sequences, batches of 4 × 64 steps, Adam 1e-4, gradient clip 1,000. Loss per step:</text>
  <text x="44" y="918" class="m">pixel cross-entropy, summed over the 64 × 256 strip</text>
  <text x="44" y="936" class="m">+ 0.5 · max(1, KL[sg(post) ‖ prior])    dynamics: prior learns to guess</text>
  <text x="44" y="954" class="m">+ 0.1 · max(1, KL[post ‖ sg(prior)])    representation: stay guessable</text>
  <text x="44" y="972" class="m">+ 1000 · Σ (predicted level − felt level)²</text>
  <text x="44" y="990" class="m">+ reward cross-entropy (two-hot of symlog r)</text>
  <text x="44" y="1008" class="m pl">+ ensemble squared error (Δ stores ×100)</text>
  <text x="32" y="1034" class="s">sg = stop-gradient; 1 nat of free bits; settings as DreamerV3 (Hafner et al. 2023).</text>
  <text x="32" y="1056" class="s">Learns from birth on the sheep's own behaviour (random weights, no scripted</text>
  <text x="32" y="1072" class="s">data; 300 iterations of infancy with a uniform policy). Scripted pretraining</text>
  <text x="32" y="1088" class="s">taught it that drinking works anywhere (M1 README, the probe).</text>
  <text x="32" y="1112" class="n">Code: flock/wm.py (loss_fn), scripts/m1_wm_train.py, scripts/m1_agent.py.</text>

  <rect x="740" y="850" width="740" height="290" class="grp" rx="8"/>
  <text x="752" y="874" class="t">Training the actor-critic in imagination (world model frozen)</text>
  <text x="752" y="898" class="s">1. Start from posterior states feat(t) inferred on real sequences of the sheep's own play.</text>
  <text x="752" y="918" class="s">2. Imagine H = 32 steps: the actor picks an action, img_in + GRU step h, the prior samples z.</text>
  <text x="752" y="938" class="s">3. Reward of each imagined step from the reward head</text>
  <text x="1068" y="938" class="s pl">+ curiosity.</text>
  <text x="752" y="958" class="s">4. λ-returns (γ 0.997, λ 0.95), bootstrapped by the slow critic.</text>
  <text x="752" y="978" class="s">5. Actor: REINFORCE on advantage / max(1, S), S = EMA of the 5–95 % advantage spread,</text>
  <text x="772" y="996" class="s">plus entropy bonus 3e-4. Critic: regress on the returns and toward the slow critic.</text>
  <text x="772" y="1014" class="s">Adam 3e-5, gradient clip 100.</text>
  <text x="752" y="1040" class="s">Loop (scripts/m1_agent.py), per iteration: every sheep acts 16 steps from its own state;</text>
  <text x="752" y="1056" class="s">logged sheep's last 64 steps go to the replay; 64 world-model and 64 actor-critic updates.</text>
  <text x="752" y="1072" class="s">Reward −D, D = (Σ|1−h|⁴)^(2/4): fixed and internal (homeostatic), growing as the square</text>
  <text x="752" y="1088" class="s">of the worst deficit; only its prediction is learned.</text>
  <text x="752" y="1112" class="n">Code: flock/ac.py (imagine, lambda_returns, ac_loss, train_step), flock/meadow/drives.py.</text>
</svg>
